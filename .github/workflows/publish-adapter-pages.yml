name: Publish adapter distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published adapter release tag to publish to Pages
        required: true
        type: string
      announce:
        description: Post the normal Discord announcement after successful publication
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: adapter-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'adapters/')) || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'adapters/')) }}
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.release.outputs.slug }}
      version: ${{ steps.release.outputs.version }}
      display_name: ${{ steps.release.outputs.display_name }}
      game_version: ${{ steps.release.outputs.game_version }}
      game_build: ${{ steps.release.outputs.game_build }}
      changelog: ${{ steps.release.outputs.changelog }}
      package_url: ${{ steps.release.outputs.package_url }}
      published_at: ${{ steps.release.outputs.published_at }}
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      PUBLIC_BASE_URL: https://komandio-labs.github.io/kontrol-adapters
      SIGNING_PRIVATE_KEY: ${{ secrets.KONTROL_SIGNING_PRIVATE_KEY }}
      SIGNING_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFhI24Bm7Lmc6eBMc17hlZu6T/TXzNnJfq/t7enTqihtr3Vw6gSSiltl+5GZ29klmSkY5E1NMuX4A5qhBGl18cQ==
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate release identity and signing configuration
        id: release
        shell: bash
        run: |
          test -n "$SIGNING_PRIVATE_KEY" || { echo "KONTROL_SIGNING_PRIVATE_KEY is not configured." >&2; exit 1; }
          release_json="$(gh release view "$TAG" --json tagName,isDraft)"
          release_tag="$(jq -r '.tagName' <<<"$release_json")"
          release_is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          test "$release_tag" = "$TAG" || { echo "GitHub Release tag does not match the requested tag: $TAG" >&2; exit 1; }
          test "$release_is_draft" = "false" || { echo "The GitHub Release must be published before adapter distribution." >&2; exit 1; }
          published_at="$(gh release view "$TAG" --json publishedAt --jq '.publishedAt')"
          test -n "$published_at" && test "$published_at" != "null" || { echo "GitHub Release has no publication timestamp: $TAG" >&2; exit 1; }
          IFS=/ read -r scope slug version <<< "$TAG"
          test "$scope" = "adapters"
          test -n "$slug" && test -n "$version"
          version="${version#v}"
          manifest=""
          while IFS= read -r candidate; do
            if test "$(jq -r '.slug // .adapterId // empty' "$candidate")" = "$slug"; then
              manifest="$candidate"
              break
            fi
          done < <(find src/Adapters -mindepth 2 -maxdepth 2 -name package.json -print | sort)
          test -n "$manifest" || { echo "No adapter manifest found for slug: $slug" >&2; exit 1; }
          manifest_version="$(jq -r '.adapterVersion' "$manifest")"
          test "$manifest_version" = "$version"
          adapter_dir="$(dirname "$manifest")"
          display_name="$(jq -r '.displayName // .name // empty' "$manifest")"
          game_version="$(jq -r '.gameProductVersion // .gameBuildIdentity.productVersion // empty' "$manifest")"
          game_build="$(jq -r '.gameBuildIdentity.platformBuildId // empty' "$manifest")"
          changelog="$adapter_dir/CHANGELOG.md"
          test -n "$display_name" && test -n "$game_version"
          test -f "$changelog" || { echo "Adapter changelog not found: $changelog" >&2; exit 1; }
          channel=stable
          [[ "$version" == *-* ]] && channel=beta
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"
          echo "game_build=$game_build" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "package_url=$PUBLIC_BASE_URL/packages/$slug/$version/kontrol-adapter-$slug-$version-win-x64.zip" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "package=kontrol-adapter-$slug-$version-win-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Download locally validated release package
        run: gh release download "$TAG" --pattern "${{ steps.release.outputs.package }}" --dir release-input

      - name: Restore publication tool
        run: dotnet restore tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj

      - name: Verify unchanged release package
        id: package
        shell: bash
        run: |
          package="${{ steps.release.outputs.package }}"
          file="release-input/$package"
          test -f "$file" || { echo "Release package not found: $file" >&2; exit 1; }
          release_json="$(gh release view "$TAG" --json assets)"
          asset_digest="$(jq -r --arg package "$package" '.assets[] | select(.name == $package) | .digest // empty' <<<"$release_json")"
          test -n "$asset_digest" || { echo "GitHub did not provide a SHA-256 digest for release asset $package." >&2; exit 1; }
          local_sha256="$(sha256sum "$file" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
          release_sha256="$(sed 's/^sha256://' <<<"$asset_digest" | tr '[:upper:]' '[:lower:]')"
          test "$local_sha256" = "$release_sha256" || {
            echo "Downloaded package SHA-256 $local_sha256 does not match GitHub release asset digest $asset_digest." >&2
            exit 1
          }
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- verify-package \
            --package "$file" --public-key "$SIGNING_PUBLIC_KEY"
          echo "sha256=$local_sha256" >> "$GITHUB_OUTPUT"

      - name: Load existing public Pages content
        shell: bash
        run: |
          if git ls-remote --exit-code origin gh-pages; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          else
            mkdir pages
            git -C pages init
            git -C pages checkout --orphan gh-pages
            git -C pages config user.name "github-actions[bot]"
            git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          if [ -d "pages-template" ]; then
            cp -r pages-template/* pages/
          fi

      - name: Create signed descriptor and catalog
        shell: bash
        run: |
          slug="${{ steps.release.outputs.slug }}"
          version="${{ steps.release.outputs.version }}"
          package="${{ steps.release.outputs.package }}"
          commit="$(git rev-parse HEAD)"
          descriptor="pages/releases/$slug-$version.json"
          public_package="pages/packages/$slug/$version/$package"
          mkdir -p "pages/packages/$slug/$version" "pages/releases" "pages/catalog/v1"
          test ! -e "$descriptor" || { echo "Release descriptor already exists: $descriptor. Existing public releases are immutable." >&2; exit 1; }
          test ! -e "$public_package" || { echo "Release package already exists: $public_package. Existing public releases are immutable." >&2; exit 1; }
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- release create \
            --adapter "$slug" --package "release-input/$package" \
            --package-url "$PUBLIC_BASE_URL/packages/$slug/$version/$package" \
            --tag "$TAG" --commit "$commit" --channel "${{ steps.release.outputs.channel }}" \
            --published-at "${{ steps.release.outputs.published_at }}" --output "$descriptor"
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- release validate \
            --descriptor "$descriptor" --package "release-input/$package"
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- release sign \
            --descriptor "$descriptor" --private-key "$SIGNING_PRIVATE_KEY"
          cp "release-input/$package" "$public_package"
          pages_sha256="$(sha256sum "$public_package" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
          test "$pages_sha256" = "${{ steps.package.outputs.sha256 }}" || {
            echo "Pages package SHA-256 $pages_sha256 differs from the verified release asset ${{ steps.package.outputs.sha256 }}." >&2
            exit 1
          }
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- verify-package \
            --package "$public_package"
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- catalog build \
            --releases pages/releases --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output pages/catalog/v1/catalog.json
          dotnet run --project tools/Kontrol.AdapterTool/Kontrol.AdapterTool.csproj -- catalog sign \
            --catalog pages/catalog/v1/catalog.json --private-key "$SIGNING_PRIVATE_KEY"

      - name: Commit and publish public Pages content
        shell: bash
        run: |
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add .
          git -C pages commit -m "publish(${{ steps.release.outputs.slug }}): v${{ steps.release.outputs.version }} (${{ steps.release.outputs.channel }})"
          git -C pages push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  announce:
    name: Announce published adapter
    needs: publish
    if: ${{ needs.publish.result == 'success' && (github.event_name == 'release' || github.event.inputs.announce == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the published adapter source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build the Discord announcement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          python .github/scripts/build_discord_announcement.py \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output artifacts/announcement/adapter-release.txt

      - name: Post to #kontrol-announcements
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python .github/scripts/post_discord_announcement.py --channel-id 1541835027980230706 --file artifacts/announcement/adapter-release.txt
