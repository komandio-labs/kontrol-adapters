name: Publish Kontrol SDK to GitHub Packages

on:
  push:
    tags:
      - "sdk/v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sdk-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish SDK
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
      SDK_PROJECT: src/Kontrol.Sdk/Kontrol.Sdk.csproj
      PACKAGE_OUTPUT: artifacts/nuget

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read and validate SDK version
        id: version
        shell: bash
        run: |
          version="$(dotnet msbuild "$SDK_PROJECT" -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          test "$GITHUB_REF_TYPE" = "tag" || {
            echo "SDK publication must run from an sdk/v* tag." >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == sdk/v* ]] || {
            echo "SDK publication tag must use the sdk/v<version> form." >&2
            exit 1
          }
          tag_version="${GITHUB_REF_NAME#sdk/v}"
          test "$tag_version" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match SDK version $version." >&2
            exit 1
          }

      - name: Validate SDK changelog and prepare release notes
        id: release-notes
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          changelog="src/Kontrol.Sdk/CHANGELOG.md"
          test -f "$changelog"
          mkdir -p artifacts
          awk -v version="$PACKAGE_VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$changelog" > artifacts/sdk-release-notes.md
          test -s artifacts/sdk-release-notes.md || {
            echo "No changelog section found for SDK version $PACKAGE_VERSION." >&2
            exit 1
          }

      - name: Restore SDK and validation tests
        run: |
          dotnet restore "$SDK_PROJECT"
          dotnet restore tools/Kontrol.AdapterTool.Tests/Kontrol.AdapterTool.Tests.csproj

      - name: Build SDK
        run: dotnet build "$SDK_PROJECT" --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Run portable validation tests
        run: dotnet test tools/Kontrol.AdapterTool.Tests/Kontrol.AdapterTool.Tests.csproj --configuration Release --no-restore

      - name: Pack SDK
        run: |
          dotnet pack "$SDK_PROJECT" --configuration Release --no-build --no-restore \
            -p:GeneratePackageOnBuild=false \
            --output "$PACKAGE_OUTPUT"

      - name: Publish package to GitHub Packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$PACKAGE_OUTPUT/Kontrol.Sdk.$PACKAGE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/komandio-labs/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "Kontrol.Sdk v$PACKAGE_VERSION" \
            --notes-file artifacts/sdk-release-notes.md
