name: Bug report
description: Report a reproducible problem with an adapter, SDK, package, or catalog.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: adapter
    attributes:
      label: Adapter and version
      placeholder: spaceengineers2 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version and deployment method
      placeholder: Space Engineers 2 2.3.0.2798, Native Plugin Parameter
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal paths before attaching logs.
